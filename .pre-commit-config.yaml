repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint -s -c .yamllint.yaml
        language: system
        types: [yaml]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
