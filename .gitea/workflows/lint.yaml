name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          sudo mv ./actionlint /usr/local/bin/

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

      - name: Run actionlint
        run: actionlint ./.gitea/workflows/*.yml

      - name: Helm lint
        run: helm lint ./helm-chart/kubernetes-app-nginx      # <- change to your chart folder
