name: Lint

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint actionlint

      - name: Run yamllint
        run: yamllint -s -c .yamllint.yaml .

      - name: Run actionlint
        run: actionlint

      - name: Helm lint
        run: helm lint ./helm-chart/kubernetes-app-nginx      # <- change to your chart folder
