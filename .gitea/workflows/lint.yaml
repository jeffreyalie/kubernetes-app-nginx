name: Lint

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit (yamllint, actionlint, whitespace)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Helm lint
        run: helm lint ./CHART_DIR      # <- change to your chart folder
