# helm-chart/values-staging.yaml
# Overrides for the staging environment
replicaCount: 1

image:
  repository: localhost:32000/kubernetes-app-nginx
  tag: v4
  pullPolicy: Always

service:
  type: ClusterIP # This is the default service type. You can change it to NodePort or LoadBalancer if you want to expose the service externally.
  port: 80 # Thisis the port that the service will expose. You can change it to any port you want.
  targetPort: 80 # This MUST match your nginx container port in deployment.yaml

ingress:
  enabled: true
  className: "public"
  host: "staging-nginx.local"

